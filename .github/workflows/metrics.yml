name: Metrics

on:
  # Schedule daily updates at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
  # Run automatically when pushing to main (ignore SVG changes to avoid loops)
  push:
    branches:
      - main
    paths-ignore:
      - "**.svg"

# Prevent concurrent runs from conflicting when committing
concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Languages Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: joelorbit
          template: classic
          base: ""
          config_timezone: Africa/Addis_Ababa
          filename: metrics.plugin.languages.svg
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          retries: 3
          retries_delay: 300

